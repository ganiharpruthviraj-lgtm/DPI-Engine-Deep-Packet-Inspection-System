name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build Targets
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Smoke Test (Linux)
      if: runner.os == 'Linux'
      run: |
        ./build/dpi_engine test_dpi.pcap output.pcap
        test -f output.pcap

    - name: Smoke Test (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $exePath = if (Test-Path "build\Release\dpi_engine.exe") { "build\Release\dpi_engine.exe" } else { "build\dpi_engine.exe" }
        & $exePath test_dpi.pcap output.pcap
        if (-not (Test-Path "output.pcap")) { exit 1 }
